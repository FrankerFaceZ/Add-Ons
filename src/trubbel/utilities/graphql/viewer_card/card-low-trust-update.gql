mutation Trubbel_UpdateLowTrustUserTreatment($input: UpdateLowTrustUserTreatmentInput!) {
  updateLowTrustUserTreatment(input: $input) {
    properties {
      id
      treatment {
        type
        updatedAt
        updatedBy {
          id
          login
          displayName
        }
      }
    }
    error
  }
}